# Arcade-NMKMacPlus_MiSTer -- vendored dependency lock file.
#
# The template / fx68k / sdram / hiscore / crt_adjust pins are carried over
# unchanged from Arcade-JalecoMS1Z_MiSTer (see that file for their notes); do not
# bump a pin during bring-up. TG68K.C and the ES5506 come from
# Arcade-ITech32_MiSTer, which already runs a 25 MHz 68EC020 game and an ES5506
# on this FPGA. The build-required subsets are committed, as in the siblings.
#
# format: name|kind|git_url|ref|dest_path|license|notes
template_mister|repo|https://github.com/MiSTer-devel/Template_MiSTer.git|3ea1134cf05d62c2b1db30362277a823d739ced2|sys|GPL-2.0|Top-level MiSTer framework (hps_io, video_mixer, scandoubler, OSD, PLL/tcl scripts). Also the source for the Template.sv/.sdc/.qpf/.qsf skeleton copied once into the repo root (see tools/bootstrap.sh) — GPL-2.0-only, NOT compatible-by-default with the GPL-3.0-only components below in a combined work; flagged in docs/PLAN.md, resolve before any public release.
fx68k|repo|https://github.com/ijor/fx68k.git|0602ee4627b10f301298f2673d826cdd6baa9327|rtl/third_party/fx68k|GPL-3.0|Motorola 68000 cycle-accurate core (Jorge Cwik / ijor). Flat repo: fx68k.sv, fx68kAlu.sv, uaddrPla.sv, .mem ROMs. TWO instances on this board in B and C mode (main @ 8 or 12 MHz, sound @ 7 MHz); in D mode the sound instance is held in reset and the main CPU drives the single banked OKI itself.
sdram|file|https://github.com/rmonic79/Arcade-Darius_MiSTer.git|HEAD:rtl/sdram.sv|rtl/sdram.sv|GPL-3.0-or-later (per file header, Copyright (c) 2018 Sorgelig)|No standalone upstream repo exists for this file — it's copy-pasted core-to-core. Seeded from this specific known-good copy, original blob e4228fb9bb0787f78e6a0f3bfcdc4399d89945c4.
hiscore|repo|https://github.com/MiSTer-devel/Hiscores_MiSTer.git|31789f3b6bf61c379117f73adc879e3c9d5873ae|rtl/third_party/hiscore|GPL-3.0-or-later|MAME hiscore.dat save/load module (Alan Steremberg, Jim Gregory). MODIFIED, like rtl/sdram.sv: a dump-validation pass (SM_VALINIT..SM_VALDONE) before the restore — each entry's first/last byte must match the config's start/end values or the dump is discarded; and dpram_hs rewritten to a template Quartus will infer as M10K (upstream's write-through form built ~69k ALUTs at the HS_SCOREWIDTH this family needs). Also ties off hiscore_buffer's unconnected port B. Semantics unchanged.
crt_adjust|repo|https://github.com/rmonic79/MiSTer-CRT-Adjust.git|c682de9f4acc61d8f4c7779efb48149d3baa3a8e|rtl/third_party/crt_adjust|GPL-3.0-or-later|"CRT Adjust" (Umberto Parisi / rmonic79): core-side analog CRT geometry — crt_adjust.sv (H-Size, H-Position, V-Shift through a one-line ping-pong buffer, sync kept native) and crt_vsize.sv (V-Size, PVM line-retimer or Cabinet photometric mode, self-measuring). Only rtl/crt_adjust.sv, rtl/crt_vsize.sv, LICENSE and README.md are committed. crt_adjust.sv is unmodified. *** crt_vsize.sv IS MODIFIED *** — one pipeline register (ring_q2) between the ring RAM's read mux and the Cabinet-mode square multiplier, that pipeline's phases moved one clock later, the integer square root split from 2x4 into 4x2 compare-subtract stages (needs clk/pixel >= 11), and the ring WRITE registered. Re-apply after any upstream bump. Wired by rtl/crt_chain.sv between video_retime and sys/video_mixer.sv. Needs clk/pixel >= 8 for Cabinet mode.
tg68k|repo|https://github.com/TheJesusFish/Arcade-ITech32_MiSTer.git|d461e21d12124f39c7b08c6940c75445b78959f7|rtl/third_party/tg68k|LGPL-3.0-or-later|TG68K.C (Tobias Gubener) as ITech32 ships it: upstream TobiFlex/TG68K.C ade33e396a1e647c2de9daf71ff9d5b3979639b2 plus ITech32's documented ALU (static multiplier selection) and kernel (reset-latched CPU mode) changes -- see rtl/third_party/itech32_licenses/ITech32-CREDITS.md. VHDL, CRLF line endings, unmodified here. Verilator uses rtl/third_party_gen/tg68k/TG68KdotC_Kernel.v from tools/gen_tg68k_verilog.sh.
es5506|file|https://github.com/TheJesusFish/Arcade-ITech32_MiSTer.git|d461e21d12124f39c7b08c6940c75445b78959f7:rtl/sound/itech32_es5506.sv,itech32_es5506_par.sv|rtl/third_party/es5506|GPL-3.0-or-later|Ensoniq ES5506 (OTTO) functional model (TheJesusFish). Unmodified. Its SOUND.md notes the arithmetic interpretations and the FPGA interface abstractions.
tg68_wrapper|file|https://github.com/TheJesusFish/Arcade-ITech32_MiSTer.git|d461e21d12124f39c7b08c6940c75445b78959f7:rtl/itech32/itech32_tg68_cpu.sv,itech32_tg68_bus_adapter.sv|rtl/macplus/macplus_tg68_*.sv|GPL-2.0-or-later|MODIFIED: renamed; vector shadow a parameter (off); IACK exported. Changes listed in each file's header.
